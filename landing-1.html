<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dr. Đỗ Long — Chuyên khoa Sâu răng · Phục hình · Nội nha</title>
<!-- đánh dấu có JS + áp theme đã lưu NGAY để tránh nháy (FOUC) -->
<script src="assets/js/head.js"></script>
<link href="assets/fonts/fonts.css" rel="stylesheet" />
<link href="assets/css/style.css" rel="stylesheet" />
</head>
<body class="page-landing">

  <!-- LOGO -->
  <a class="brand brand-logo" href="#home" aria-label="Dr. Đỗ Long - Chuyên khoa Sâu răng · Phục hình · Nội nha"></a>

  <!-- Nút chuyển Dark / Light -->
  <button class="theme-toggle" type="button" aria-label="Chuyển chế độ sáng/tối" title="Chế độ sáng/tối">
    <!-- mặt trăng: hiện khi đang Dark (bấm để sang Light) -->
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <!-- mặt trời: hiện khi đang Light (bấm để sang Dark) -->
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/>
    </svg>
  </button>

  <!-- Nút Lưu vị trí menu (mobile) -->
  <button class="save-btn" type="button" aria-label="Lưu vị trí menu" title="Lưu vị trí menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <path d="M17 21v-8H7v8M7 3v5h8"/>
    </svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite">Đã lưu vị trí menu</div>

  <!-- 3 điểm chọn vị trí menu (mobile): bấm chọn rồi bấm Save -->
  <div class="pos-picker">
    <button class="pos-dot left"   type="button" data-pos="left"   aria-label="Đặt menu ở góc dưới-trái"></button>
    <button class="pos-dot center" type="button" data-pos="center" aria-label="Đặt menu ở giữa-dưới"></button>
    <button class="pos-dot right"  type="button" data-pos="right"  aria-label="Đặt menu ở góc dưới-phải"></button>
  </div>

  <!-- HERO -->
  <header class="hero" id="home">
    <h1 class="visually-hidden">Dr. Đỗ Long — Bác sĩ chuyên khoa Sâu răng · Phục hình · Nội nha</h1>
  </header>

  <!-- MẶT SỐ / ỐNG KÍNH -->
  <div class="dial" aria-hidden="true">
    <div class="dial-lens">
      <svg viewBox="0 0 124 124" fill="none" stroke="currentColor">
        <circle cx="62" cy="62" r="61" stroke-opacity=".14"/>
        <circle cx="62" cy="62" r="46" stroke-opacity=".22"/>
        <g class="rot">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 62 62" to="360 62 62" dur="11s" repeatCount="indefinite"/>
          <!-- vạch chia quanh vòng -->
          <g stroke-opacity=".42" stroke-width="1">
            <line x1="62" y1="4"  x2="62" y2="12"/>
            <line x1="62" y1="112" x2="62" y2="120"/>
            <line x1="4"  y1="62" x2="12" y2="62"/>
            <line x1="112" y1="62" x2="120" y2="62"/>
            <line x1="21" y1="21" x2="27" y2="27"/>
            <line x1="97" y1="97" x2="103" y2="103"/>
            <line x1="21" y1="103" x2="27" y2="97"/>
            <line x1="97" y1="27" x2="103" y2="21"/>
          </g>
        </g>
        <g class="rot-rev">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 62 62" to="0 62 62" dur="17s" repeatCount="indefinite"/>
          <circle cx="62" cy="62" r="30" stroke-opacity=".18" stroke-dasharray="3 6"/>
        </g>
        <!-- vòng cung sáng xoay tròn (thấy rõ chuyển động) -->
        <g class="arc-spin">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 62 62" to="360 62 62" dur="3.6s" repeatCount="indefinite"/>
          <circle cx="62" cy="62" r="53" stroke-width="2" stroke-linecap="round"
                  stroke-opacity=".9" pathLength="100" stroke-dasharray="26 74"/>
        </g>
        <g class="arc-spin2">
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 62 62" to="0 62 62" dur="6s" repeatCount="indefinite"/>
          <circle cx="62" cy="62" r="38" stroke-width="1.5" stroke-linecap="round"
                  stroke-opacity=".55" pathLength="100" stroke-dasharray="14 86"/>
        </g>
        <circle cx="62" cy="62" r="6" fill="currentColor" stroke="none" fill-opacity=".9"/>
        <circle cx="62" cy="62" r="14" stroke-opacity=".45"/>
      </svg>
    </div>
  </div>

  <!-- MENU VÒNG CUNG -->
  <nav class="arc" id="mainmenu" aria-label="Menu chính">
    <div class="spoke" style="--deg:-60deg"><a href="ve-chung-toi.html">Về Dr. Đỗ Thái Long</a></div>
    <div class="spoke" style="--deg:-46deg"><a href="giai-phap-dieu-tri.html">Giải pháp điều trị</a></div>
    <div class="spoke" style="--deg:-32deg"><a href="ca-dieu-tri.html">Ca điều trị</a></div>
    <div class="spoke" style="--deg:-18deg"><a href="kien-thuc-y-khoa.html">Kiến thức y khoa</a></div>
    <div class="spoke" style="--deg:-4deg"><a href="lien-he.html">Liên hệ tư vấn</a></div>
  </nav>


  <!-- ============ Thư viện hiệu ứng ============ -->
  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>
